<app-header></app-header>

<main class="marca-page">
  <div class="banner" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://media.istockphoto.com/id/1174960767/es/foto/moto-retro-cl%C3%A1sica-honda-super-cub-110cc-renovar-y-popular-en-la-cultura-pop-vintage-22-de.jpg?s=612x612&w=0&k=20&c=JciBOeK1hEwmt_oPJvzXprvzv11Q2lA_zW2rfGQb7WY=');">
    <h1>HONDA</h1>
    <p>El poder de los sueños</p>
  </div>

  <section class="modelos-section">
    <h2>MODELOS <span>HONDA</span></h2>
    <p>6 modelos disponibles</p>

    <div class="motos-grid">
      @for (moto of motos; track moto.modelo) {
        <div class="moto-card">
          <div class="moto-image">
            <img [src]="moto.imagen" [alt]="moto.modelo">
            <span class="marca-badge">HONDA</span>
          </div>
          <div class="moto-info">
            <h3>{{moto.modelo}}</h3>
            <p class="descripcion">{{moto.descripcion}}</p>
            <div class="specs">
              <span>🏍️ {{moto.cilindraje}}</span>
              <span>⚡ {{moto.potencia}}</span>
            </div>
            <div class="precio">{{moto.precio}}</div>
            <button class="btn-detalles">Ver detalles</button>
          </div>
        </div>
      }
    </div>
  </section>
</main>

<app-footer></app-footer>
