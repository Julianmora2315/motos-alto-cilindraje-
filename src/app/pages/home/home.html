<app-header></app-header>

<!-- Hero Section -->
<section class="hero-section">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1 class="hero-title">MOTOS DE ALTO CILINDRAJE</h1>
    <p class="hero-subtitle">Las mejores motocicletas deportivas del mercado</p>
    <button class="btn-hero" (click)="contactar()">CONTÁCTANOS</button>
  </div>
</section>

<!-- Marcas Section -->
<section class="marcas-section" id="marcas">
  <div class="container">
    <h2 class="section-title">NUESTRAS <span class="highlight">MARCAS</span></h2>

    <div class="marcas-grid">
      <a *ngFor="let marca of marcas" [routerLink]="marca.ruta" class="marca-card">
        <div class="marca-nombre" [style.color]="marca.color">{{ marca.nombre }}</div>
        <div class="marca-arrow">→</div>
      </a>
    </div>
  </div>
</section>

<!-- CTA Section -->
<section class="cta-section">
  <div class="container">
    <h2 class="cta-title">¿Listo para tu próxima aventura?</h2>
    <p class="cta-text">Visita nuestro showroom y prueba la moto de tus sueños</p>
    <div class="cta-buttons">
      <button class="btn-primary" (click)="agendarTestDrive()">Formulario</button>
      <button class="btn-secondary" (click)="contactar()">Contáctanos</button>
    </div>
  </div>
</section>

<app-footer></app-footer>
