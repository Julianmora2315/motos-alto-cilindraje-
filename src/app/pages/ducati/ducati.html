<app-header></app-header>

<main class="marca-page">
  <div class="banner" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://cybermotorcycle.com/gallery/ducati-bevel-twins/images/Ducati-1973-750SS-WP-23.jpg');">
    <h1>DUCATI</h1>
    <p>Rendimiento más allá de la pasión</p>
  </div>

  <section class="modelos-section">
    <h2>MODELOS <span>DUCATI</span></h2>
    <p>6 modelos disponibles</p>

    <div class="motos-grid">
      @for (moto of motos; track moto.modelo) {
        <div class="moto-card">
          <div class="moto-image">
            <img [src]="moto.imagen" [alt]="moto.modelo">
            <span class="marca-badge">DUCATI</span>
          </div>
          <div class="moto-info">
            <h3>{{moto.modelo}}</h3>
            <p class="descripcion">{{moto.descripcion}}</p>
            <div class="specs">
              <span>🏍️ {{moto.cilindraje}}</span>
              <span>⚡ {{moto.potencia}}</span>
            </div>
            <div class="precio">{{moto.precio}}</div>
            <button class="btn-detalles">Ver detalles</button>
          </div>
        </div>
      }
    </div>
  </section>
</main>

<app-footer></app-footer>
