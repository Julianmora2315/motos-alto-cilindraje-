<app-header></app-header>

<main class="marca-page">
  <div class="banner" style="background-image: url('https://us.123rf.com/450wm/antonio722/antonio7222508/antonio722250800427/250184556-showroom-display-featuring-retro-inspired-street-motorbikes-and-elegant-cafe-racer-designs.jpg?ver=6');">
    <h1>YAMAHA</h1>
    <p>Motos de alto rendimiento</p>
  </div>

  <section class="modelos-section">
    <h2>MODELOS <span>YAMAHA</span></h2>
    <p>6 modelos disponibles</p>

    <div class="motos-grid">
      @for (moto of motos; track moto.modelo) {
        <div class="moto-card">
          <div class="moto-image">
            <img [src]="moto.imagen" [alt]="moto.modelo">
            <span class="marca-badge">YAMAHA</span>
          </div>
          <div class="moto-info">
            <h3>{{moto.modelo}}</h3>
            <p class="descripcion">{{moto.descripcion}}</p>
            <div class="specs">
              <span>🏍️ {{moto.cilindraje}}</span>
              <span>⚡ {{moto.potencia}}</span>
            </div>
            <div class="precio">{{moto.precio}}</div>
            <button class="btn-detalles">Ver detalles</button>
          </div>
        </div>
      }
    </div>
  </section>
</main>

<app-footer></app-footer>
