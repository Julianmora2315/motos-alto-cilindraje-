<div class="moto-card">
  <div class="moto-image">
    <img [src]="moto.imagen" [alt]="moto.nombre">
    <div class="marca-badge">{{ moto.marca }}</div>
  </div>
  <div class="moto-info">
    <h3>{{ moto.nombre }}</h3>
    <p class="descripcion">{{ moto.descripcion }}</p>
    <div class="specs">
      <span class="spec-item">
        <i class="icon">🏍️</i>
        {{ moto.cilindraje }}
      </span>
      <span class="spec-item">
        <i class="icon">⚡</i>
        {{ moto.potencia }}
      </span>
    </div>
    <div class="precio">${{ moto.precio.toLocaleString() }}</div>
    <button class="btn-detalle" (click)="verDetalles()">Ver detalles</button>
  </div>
</div>
